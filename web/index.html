<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rollstuhlhandball Bundesliga">
  <meta name="keywords" content="Rollstuhlhandball, Bundesliga, RHBL, Wheelchair Handball, Tournament, Turnier, Management">
  <meta name="author" content="Rollstuhlhandball Bundesliga">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RHBL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Theme color -->
  <meta name="theme-color" content="#e63946">
  <meta name="msapplication-TileColor" content="#e63946">

  <title>Rollstuhlhandball Bundesliga - Tournament Management</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Console filter to remove debug spam -->
  <script src="console_filter.js"></script>

  <!-- Firebase configuration will be injected by Flutter -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
</head>
<body>
  <!-- Loading indicator -->
  <div id="loading" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #ffb3c8 0%, #ffafb4 25%, #fed1ba 75%, #ffcbbd 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: 'Arial', sans-serif;
    z-index: 9999;
  ">
    <!-- Spinning Logo -->
    <div style="
      width: 200px;
      height: 200px;
      background-image: url('logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      animation: spin 2s linear infinite;
      margin-bottom: 24px;
    "></div>
    
    <!-- GBO Text -->
    <h1 style="
      color: #000;
      margin: 0px 0px -20px 0;
      font-size: 120px;
      font-weight: bold;
      letter-spacing: 2px;
      font-family: 'CasanovaScotia', 'Arial', sans-serif;
    ">RHBL</h1>
    
    <!-- German Beach Open Text -->
    <h2 style="
      color: #000;
      margin: 0 0 16px 0;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 1px;
      font-family: 'MyriadPro', 'Arial', sans-serif;
    ">Rollstuhlhandball Bundesliga</h2>
    
    <!-- Version Number -->
    <div id="version-display" style="
      color: #000;
      margin: 0 0 16px 0;
      font-size: 14px;
      font-weight: normal;
      letter-spacing: 0.5px;
      font-family: 'Arial', sans-serif;
      opacity: 0.8;
    ">Version loading...</div>
    
    <!-- German Flag Stripe - Full width at bottom -->
    <div style="
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(
        to right,
        #000000 0%,
        #000000 30%,
        transparent 30.01%,
        transparent 35%,
        #c10003 35.01%,
        #c10003 65%,
        transparent 65.01%,
        transparent 70%,
        #ffd765 70.01%,
        #ffd765 100%
      );
    "></div>
  </div>

  <style>
    


    @font-face {
      font-family: 'CasanovaScotia';
      src: url('Casanova Scotia.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    
    @font-face {
      font-family: 'MyriadPro';
      src: url('MYRIADPRO-BOLD.OTF') format('opentype');
      font-weight: bold;
      font-style: normal;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Create sparkles
    

    // Create sparkles when page loads

    // Hide loading indicator when Flutter app loads
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });

    // Function to update version display
    window.updateVersionDisplay = function(version) {
      const versionElement = document.getElementById('version-display');
      if (versionElement) {
        versionElement.textContent = 'Version ' + version;
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
